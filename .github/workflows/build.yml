name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project
        run: |
          unzip -q project.zip -d src_project
          F=$(find src_project -name 'settings.gradle*' | head -n1)
          echo "PROJECT_DIR=$(dirname "$F")" >> $GITHUB_ENV

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build
        run: cd "$PROJECT_DIR" && gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: sonora-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
